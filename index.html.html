<style>

*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,'Noto Sans Sinhala',sans-serif}

h1{font-size:20px;margin:0;cursor:pointer}
main{max-width:960px;margin:auto;padding:0 16px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
.lc{cursor:pointer;transition:.15s}.lc:hover{border-color:var(--pr);transform:translateY(-2px)}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--ok)}
.stat{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}.stat .card{flex:1;min-width:130px;text-align:center}.stat b{font-size:26px;color:var(--pr);display:block}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:10px;cursor:pointer}
button.p{background:var(--pr);color:#fff;border-color:var(--pr)}
.tabs{display:flex;gap:8px;margin:12px 0}.tabs .on{background:var(--pr);color:#fff}
.note{padding:8px 0;border-bottom:1px dashed var(--bd)}.note:last-child{border:0}
.opt{display:block;width:100%;text-align:left;margin:8px 0}
.opt.right{background:#16a34a22;border-color:var(--ok)}.opt.wrong{background:#dc262622;border-color:var(--no)}
.ex{margin-top:10px;padding:10px;border-radius:10px;background:var(--bg);color:var(--mu)}
table{border-collapse:collapse;width:100%}td,th{border:1px solid var(--bd);padding:4px 8px;text-align:left}

if(!nm){m.textContent='කරුණාකර නම ඇතුළත් කරන්න';return}
try{const c=await makeCert(nm),safe=nm.replace(/[^\p{L}\p{N}]+/gu,'_');
if(type=='png'){const blob=await new Promise(r=>c.toBlob(r,'image/png'));await saveFile(blob,'Certificate-'+safe+'.png')}
else{if(!window.jspdf){m.textContent='PDF library එක load වුණේ නැහැ';return}
const pdf=new window.jspdf.jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
pdf.addImage(c.toDataURL('image/jpeg',.95),'JPEG',0,0,297,210);
await saveFile(pdf.output('blob'),'Certificate-'+safe+'.pdf')}
m.textContent='✅ Certificate එක save වුණා!'}
catch(e){m.textContent=e&&e.code=='declined'?'Download එක අවලංගු කළා':'Download කරන්න බැරි වුණා, නැවත උත්සාහ කරන්න'}}
function open_(k,tab){tab=tab||'n';let l=L[k];
$('#app').innerHTML=`<button onclick="home()">← Dashboard</button><h2>${l.i} ${l.t}</h2>
<div class="tabs"><button class="${tab=='n'?'on':''}" onclick="open_(${k},'n')">📖 ඉගෙන ගන්න</button><button class="${tab=='q'?'on':''}" onclick="startQ(${k})">✍️ Practice</button></div><div class="card" id="box"></div>`;
if(tab=='n')$('#box').innerHTML=l.n.map(x=>`<div class="note">${x}</div>`).join('')+`<p><button class="p" onclick="startQ(${k})">Practice කරමු →</button></p>`}
function startQ(k){open_(k,'q');quiz(k,0,0)}
function quiz(k,i,sc){let l=L[k],box=$('#box');
if(i>=l.q.length){P[k]=Math.max(P[k]||0,sc);save();
box.innerHTML=`<h3>ඔබේ ලකුණු: ${sc}/${l.q.length} ${sc==l.q.length?'🎉':sc>=l.q.length/2?'👍':'💪'}</h3><button class="p" onclick="startQ(${k})">නැවත</button> <button onclick="open_(${k})">Notes</button> <button onclick="home()">Dashboard</button>`;return}
let[q,o,a,e]=l.q[i];o=o.split('|');
box.innerHTML=`<small>ප්‍රශ්නය ${i+1}/${l.q.length}</small><h3>${q}</h3>${o.map((x,j)=>`<button class="opt" data-j="${j}">${x}</button>`).join('')}<div id="fb"></div>`;
box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{let j=+b.dataset.j,ok=j==a;
box.querySelectorAll('.opt').forEach((x,n)=>{x.disabled=true;if(n==a)x.classList.add('right')});
if(!ok)b.classList.add('wrong');
$('#fb').innerHTML=`<div class="ex">${ok?'✅ නිවැරදියි!':'❌ වැරදියි.'} ${e}</div><p><button class="p" id="nx">${i+1<l.q.length?'ඊළඟ →':'ප්‍රතිඵල'}</button></p>`;
$('#nx').onclick=()=>quiz(k,i+1,sc+(ok?1:0))})}
home();
</script></body></html>
